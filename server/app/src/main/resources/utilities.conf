# Per-utility profiles. Endpoint URLs, scopes, and paths live in this file; the clientId and
# clientSecret are treated as secrets and come from env vars (`fly secrets set` in prod,
# `mise.local.toml` for local dev) keyed on the utility id.
#
# To add a utility:
#   1. Add a new entry in the `utilities` array, in alphabetical order (for the purposes of
#      ordering, treat commented blocks the same as uncommented ones).
c#   2. Set the OPENGB_UTILITY_<ID>_CLIENTID and OPENGB_UTILITY_<ID>_CLIENTSECRET env vars.
#   3. Restart the server. (Or for Fly, `fly deploy`.)
#
# The display name format is "<Utility Name>, <Location e.g. state or province>"
#
# defaultScope format reference: https://github.com/green-button/green-button.github.io/blob/master/espi/authorization_scope.md
#
# Our scope can request both auth styles (FB_14 legacy, FB_31 modern) when utilities differ
# on which side of the upgrade they're on. The utility grants whichever it supports; the
# *granted* scope (which may be a subset) comes back in the token response and is what we
# persist. See RefreshBlob construction in routes/Connect.kt for the dual-style handling.
#
# Format params we ideally tack onto every scope string:
#   IntervalDuration  900_3600  accept both 15-min and 1-hr readings; utility serves whichever
#   BlockDuration     Monthly   billing-aligned aggregates
#   HistoryLength     94608000  36 months — asks the *utility* how much history to authorize
#   SubscriptionFrequency  Daily  daily push notifications
#   AccountCollection 5         covers elec + gas + water + spare
#
# published-min/max wire format: the ESPI resource GET sends these date-range query params as ISO
# 8601 (e.g. `2026-06-08T00:00:00Z`). A `published-max` in the future is clamped to now before the
# request — no custodian publishes future-dated readings, and some (savagedata) reject a future
# published-max with a bare 400. See proxy/UsageClient.kt.
#
# TLS client authentication (mTLS): the default cert lives in application.conf's `clientAuth` block
# and is used for every utility here. A utility with different requirements (e.g. a cert the utility
# issues rather than our self-signed default) can override it with its own `clientAuth` block —
# same shape, backed by its own env/Fly secret — which takes precedence over the default. See the
# PG&E template below for the syntax.
#
# `initialHistory` (per-utility, below) is a separate, client-facing knob: how far back the Home
# Assistant client backfills `published-min` on the *first* fetch. Expressed human-friendly —
# `2y`, `6m`, `90d` (units: d/w/m/y; m=30d, y=365d). It's surfaced to the client in the claim
# response (as seconds) and is the single source of truth for the backfill window. The scope
# `HistoryLength` above is the utility-facing analogue; the two normally agree, but for the
# test-lab harness the scope value isn't accepted, so `initialHistory` is the effective control.

utilities = [
  # ---------------------------------------------------------------------------------------------
  # Alectra
  #
  # CERTIFICATION SANDBOX (not production).
  #
  # Operated by Savage Data
  #
  # Same ESPI 3.3 dynamic-registration flow as Milton Hydro, but a DISTINCT app registration —
  # own clientId/secret, own scope (note: no "35" in the FB list here, unlike Milton's).
  #
  # Secrets (never committed) — set all before deploy:
  #   OPENGB_UTILITY_ALECTRA_CLIENTID
  #   OPENGB_UTILITY_ALECTRA_CLIENTSECRET
  #
  # Registered redirect_uri: https://api.opengreenbutton.org/connect/alectra/callback
  # Registered thirdPartyNotifyUri: https://api.opengreenbutton.org/notify/alectra
  {
    id = "alectra"
    displayName = "Alectra, Ontario (SANDBOX for testing only)"
    authorizeUrl = "https://sandboxdc.savagedata.com:4243/connect/authorize"
    tokenUrl = "https://sandboxdc.savagedata.com:4243/connect/token"
    clientId = ${?OPENGB_UTILITY_ALECTRA_CLIENTID}
    clientSecret = ${?OPENGB_UTILITY_ALECTRA_CLIENTSECRET}
    defaultScope = "FB=1_3_4_5_6_7_8_9_12_15_16_17_27_28_36_37_40_51_54_55_56_57_58_59_60_61;SubscriptionFrequency=Daily"
    initialHistory = "2y"
    notificationPath = "/notify/alectra"
    tokenAuthStyle = "HTTP_BASIC"
  }

  {
    # Burlington Hydro
    #
    # Operated by London Hydro
    #
    id = "burlington_hydro"
    displayName = "Burlington Hydro, Ontario"
    authorizeUrl = "https://greenbutton.burlingtonhydro.com/oauth/authorize"
    tokenUrl = "https://greenbutton.burlingtonhydro.com/oauth/token"
    clientId = ${?OPENGB_UTILITY_BURLINGTON_HYDRO_CLIENTID}
    clientSecret = ${?OPENGB_UTILITY_BURLINGTON_HYDRO_CLIENTSECRET}
    defaultScope = "FB=1_3_4_5_13_15_16_28_31_37_39_51_53_54_55_56_57_58_59_60_61_64_65_68_69"
    # refreshScope defaults to `Granted` (see utility/RefreshScope.kt). Burlington echoes this full
    # scope at exchange and accepts it verbatim on refresh — AND accepts a scopeless refresh —
    # confirmed 2026-07-10 via onboardProbeBurlingtonRefreshScope, so the Granted default is safe.
    # Two years of backfill on first auth. Bounded to keep the initial pull manageable; bump
    # per-utility if a provider both retains and will serve more.
    initialHistory = "2y"
    notificationPath = "/notify/burlington_hydro"
    tokenAuthStyle = "HTTP_BASIC"
    # NOTE: do NOT set quirks.dateFilterParam = "updated" here. That was tried 2026-07-08 on
    # the theory that published-min never returns fresh data — it was reverted once a direct
    # probe (bypassing a since-fixed HA-side cursor bug) showed updated-min returns the FULL
    # ~2.5-year history regardless of window (narrow and wide requests returned an identical
    # 22,008 readings), which is not incremental at all and would violate the incremental-only
    # commitment made to Burlington. A correctly-scoped published-min probe, once run with a
    # healthy (non-poisoned) cursor, returned exactly the newest day of data as expected — see
    # docs/utilities/burlington-incremental-issue.md for the full investigation.
  }

