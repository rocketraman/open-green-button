  # ---------------------------------------------------------------------------------------------
  # Kentucky Utilities (KU) — part of LG&E and KU Energy (PPL)
  #
  # Scope history (empirically bracketed) — authorize and refresh scopes are DECOUPLED
  # (defaultScope = /authorize, refreshScope = refresh grant; see utility/RefreshScope.kt):
  #   - /authorize: only the FULL scope below works. No-scope and the bare FB list both fail with
  #     `invalid_scope` at /authorize (confirmed 2026-07-10). So KU REQUIRES the full param string
  #     to start the flow; defaultScope stays as-is.
  #   - refresh: refreshScope defaults to `Granted` and is required for KU — a SCOPELESS refresh
  #     should use the originally granted scope, but KU fails it with `invalid_scope` "requested
  #     does not match the scope granted by the resource owner" (commit 3051c70);
  #
  {
    id = "kentucky_utilities"
    displayName = "Kentucky Utilities, Kentucky"
    authorizeUrl = "https://mymeter.lge-ku.com/OAuthServer/authorize"
    tokenUrl = "https://mymeter.lge-ku.com/OAuthServer/token"
