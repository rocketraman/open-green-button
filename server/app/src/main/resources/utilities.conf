  # ---------------------------------------------------------------------------------------------
  # Enbridge Gas
  #
  # Operated in-house by Enbridge on Okta. NO sandbox: onboarding and connectivity testing run
  # against production, and there are no test customers — the first real authorization has to come
  # from an actual Enbridge Gas customer. See docs/utilities/enbridge.md.
  #
  # The authorize URL is Enbridge's MyAccount Green Button sign-in page, not an Okta endpoint: the
  # customer signs in (or identifies by contract account + postal code + email), picks data
  # categories / period / accounts, and is sent back to our redirect_uri with a code. The code is
  # exchanged at the Okta token endpoint (client_secret_basic).
  #
  # Scope: `offline_access` (space-separated, Okta-style) is what makes Okta issue a refresh token —
  # without it the authorization dies with the first access token. Our ApplicationInformation
  # (`./gradlew :app:onboardFetchAppInfo --args="enbridge"`, registration scope FB=36_40) lists
  # seven registered scopes — every combination of the three data categories the customer can tick
  # on Enbridge's consent form, over a common base FB=1_3_13_31_35_37_39:
  #   usage     4_10
  #   billing   15
  #   account   51_53_54_55_56_57_58_59_60_64_65_66_69
  # (all with IntervalDuration=86400;BlockDuration=Monthly;HistoryLength=63072000). We request the
  # all-three combination, which is one of the seven verbatim; the customer can narrow it on the
  # consent form, and the granted scope comes back in the token response.
  #
  # Registered redirect_uri: https://api.opengreenbutton.org/connect/enbridge/callback
  # (originally submitted as the literal `<utility_slug>` template; Enbridge corrected it to the
  # `enbridge` slug 2026-10-28, confirmed via ApplicationInformation).
  # Registered thirdPartyNotifyUri: https://api.opengreenbutton.org/notify/enbridge
  {
    id = "enbridge"
    displayName = "Enbridge Gas, Ontario"
    authorizeUrl = "https://myaccount.enbridgegas.com/green-button/sign-in"
    tokenUrl = "https://api.enbridgegas.com/oauth2/default/v1/token"
    clientId = ${?OPENGB_UTILITY_ENBRIDGE_CLIENTID}
    clientSecret = ${?OPENGB_UTILITY_ENBRIDGE_CLIENTSECRET}
    defaultScope = "FB=1_3_4_10_13_15_31_35_37_39_51_53_54_55_56_57_58_59_60_64_65_66_69;IntervalDuration=86400;BlockDuration=Monthly;HistoryLength=63072000 offline_access"
    # Every powerOfTenMultiplier in the feed has the wrong sign: usage (538 m³ is sent as 538000
    # at 3) and cost (a $35.03 bill as 35030 at 3). Reported to Enbridge 2026-10-28. Both keep
    # working if they fix it; remove each once their feed sends -3 there.
    quirks {
      invertUsageIfPositiveMultiplier = true
      invertCostIfPositiveMultiplier = true
    }
  }

